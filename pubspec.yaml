name: moodsound
description: "MoodSound - Tu música según tu estado de ánimo"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API
  http: ^1.2.1

  # Estado
  provider: ^6.1.2

  # Guardar sesión
  shared_preferences: ^2.2.3

  # Reproducir audio
  audioplayers: ^6.0.0

  # Animaciones JSON
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animation/
    - assets/images/
